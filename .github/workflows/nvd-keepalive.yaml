name: NVD cache keep-alive
 
# Cache GitHuba wygasa po 7 dniach OD OSTATNIEGO ODCZYTU.
# Ten cron czyta cache co 3 dni -> licznik sie resetuje -> wpis nie wygasa.
# Uwaga: scheduled workflow GitHub wylacza po 60 dniach bez commita w repo.
# Dlatego seed w release (nvd-seed) jest twardym fallbackiem - patrz ci.yaml.
 
on:
  schedule:
    - cron: '0 1 * * *' 
  workflow_dispatch:
 
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore NVD cache
        uses: actions/cache/restore@v4
        with:
          path: .nvd-cache
          key: nvd-v4-cron-${{ github.run_id }}
          restore-keys: |
            nvd-v4-cron-
            nvd-v4
 
      - name: Update NVD database
        run: make owasp_update
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Save updated NVD database
        uses: actions/cache/save@v4
        with:
          path: .nvd-cache
          key: nvd-v4-cron-${{ github.run_id }}
 