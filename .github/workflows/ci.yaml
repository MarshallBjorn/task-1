name: CI

on:
  push:
    branches: [ main ]

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Maven .m2
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            m2-

      - name: Populate .m2 if needed
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/backend:/app \
            -v ~/.m2:/root/.m2 \
            -w /app \
            maven:3-eclipse-temurin-21 \
            mvn dependency:go-offline -q

      - name: Lint Dockerfiles
        run: |
          make dockerfile_lint SERVICE=backend
          make dockerfile_lint SERVICE=frontend

      - name: Secret scan
        run: make secret_scan

  nvd-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Cache NVD database
        id: nvd-cache
        uses: actions/cache@v4
        with:
          path: .nvd-cache
          key: nvd-v3
          restore-keys: nvd-v3
 
      - name: Seed z release jesli cache pusty
        if: steps.nvd-cache.outputs.cache-hit != 'true'
        run: |
          echo ">>> Cache pusty - sciagam gotowy seed bazy z release..."
          mkdir -p .nvd-cache
          gh release download nvd-seed \
            --pattern 'nvd-seed.tar.gz' \
            --output - | tar xz -C .nvd-cache
          sudo chown -R "$USER:$USER" .nvd-cache
          echo ">>> Zseedowano:"
          ls -lh .nvd-cache/odc.mv.db
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pipeline:
    needs: [repo-checks, nvd-update]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Maven .m2
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            m2-

      - name: Restore NVD database
        uses: actions/cache/restore@v4
        with:
          path: .nvd-cache
          key: nvd-v3
          restore-keys: nvd-v3

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Build image
        run: make build SERVICE=${{ matrix.service }} TAG=${{ github.sha }}

      - name: Trivy + Dockle scan
        run: make scan SERVICE=${{ matrix.service }} TAG=${{ github.sha }}

      - name: Generate SBOM
        run: make create_sbom SERVICE=${{ matrix.service }} TAG=${{ github.sha }}

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom/

      - name: DIAG przed OWASP
        run: |
          echo "=== RAM ==="
          free -h
          echo "=== .m2 na runnerze ==="
          ls -la /home/runner/.m2/ 2>/dev/null && du -sh /home/runner/.m2/ 2>/dev/null || echo ".m2 pusty/brak"
          echo "=== .nvd-cache ==="
          ls -lh .nvd-cache/odc.mv.db
          echo "=== docker info ==="
          docker system df
          pwd

      - name: OWASP Dependency-Check
        if: matrix.service == 'backend' && always()
        timeout-minutes: 10
        run: make owasp_dep_check SERVICE=${{ matrix.service }}

      - name: Upload OWASP report
        if: matrix.service == 'backend' && always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report-${{ matrix.service }}
          path: odc-report/

      - name: Push to GHCR
        if: github.ref == 'refs/heads/main'
        run: make push SERVICE=${{ matrix.service }} TAG=${{ github.sha }}
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
