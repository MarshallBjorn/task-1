services:
  db:
    image: postgres:15-alpine
    container_name: trippy_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trippy_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: trippy_pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trippy_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trippy_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_UPLOAD_DIR=/app/uploads
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - trippy_network
    volumes:
      - ./backend/src:/app/src
      - ./backend/pom.xml:/app/pom.xml
      - ./backend/target:/app/target
      - trippy_uploads:/app/uploads
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trippy_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - trippy_network
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules

  file_server:
    image: nginx:alpine
    container_name: trippy_file_server
    restart: unless-stopped
    ports:
      - "8888:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - trippy_uploads:/usr/share/nginx/html/uploads:ro
    networks:
      - trippy_network

volumes:
  postgres_data:
  trippy_uploads:

networks:
  trippy_network:
    driver: bridge